<script>
/* ===== Mesin rumus mini ===== */
const colN=s=>{let n=0;for(const ch of s)n=n*26+ch.charCodeAt(0)-64;return n-1};
const colL=n=>{let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s};
class FErr extends Error{constructor(c,m){super(m||c);this.code=c;this.msg=m||c}}
const isErr=v=>v&&typeof v=='object'&&v.err;
const fmtN=v=>String(+v.toFixed(9));
function tokenize(s){const t=[];let i=0;
 while(i<s.length){const c=s[i];
  if(/\s/.test(c)){i++;continue}
  if(c=='"'){let j=i+1,v='';for(;;){if(j>=s.length)throw new FErr('#KUTIP','Tanda kutip belum ditutup. Teks ditulis seperti "Snack".');if(s[j]=='"'){if(s[j+1]=='"'){v+='"';j+=2;continue}break}v+=s[j++]}t.push({k:'s',v});i=j+1;continue}
  const r=s.slice(i);let m;
  if(m=/^\$?([A-Za-z]{1,2})\$?(\d+)(?![\w(])/.exec(r)){t.push({k:'r',v:(m[1]+m[2]).toUpperCase()});i+=m[0].length;continue}
  if(m=/^\d+(\.\d+)?/.exec(r)){t.push({k:'n',v:parseFloat(m[0])});i+=m[0].length;continue}
  if(m=/^[A-Za-z_][A-Za-z0-9_.]*/.exec(r)){t.push({k:'i',v:m[0]});i+=m[0].length;continue}
  if(m=/^(<=|>=|<>|[-+*\/^&=<>(),;:%])/.exec(r)){t.push({k:'o',v:m[1]});i+=m[1].length;continue}
  throw new FErr('#SYNTAX','Karakter "'+c+'" tidak dikenali dalam rumus.')}
 return t}
function parse(t){let p=0;const pk=()=>t[p],nx=()=>t[p++];
 const isO=o=>pk()&&pk().k=='o'&&pk().v==o;
 const CO=['=','<>','<','>','<=','>='];
 function cmp(){let l=cat();while(pk()&&pk().k=='o'&&CO.includes(pk().v)){const o=nx().v;l={t:'bin',o,l,r:cat()}}return l}
 function cat(){let l=add();while(isO('&')){nx();l={t:'bin',o:'&',l,r:add()}}return l}
 function add(){let l=mul();while(isO('+')||isO('-')){const o=nx().v;l={t:'bin',o,l,r:mul()}}return l}
 function mul(){let l=pow();while(isO('*')||isO('/')){const o=nx().v;l={t:'bin',o,l,r:pow()}}return l}
 function pow(){let l=un();while(isO('^')){nx();l={t:'bin',o:'^',l,r:un()}}return l}
 function un(){if(isO('-')){nx();return{t:'neg',e:un()}}if(isO('+')){nx();return un()}return pc()}
 function pc(){let e=pri();while(isO('%')){nx();e={t:'bin',o:'/',l:e,r:{t:'n',v:100}}}return e}
 function pri(){const k=nx();if(!k)throw new FErr('#SYNTAX','Rumus belum lengkap, ada bagian yang kurang di bagian akhir.');
  if(k.k=='n')return{t:'n',v:k.v};
  if(k.k=='s')return{t:'s',v:k.v};
  if(k.k=='r'){if(isO(':')){nx();const k2=nx();if(!k2||k2.k!='r')throw new FErr('#REF!','Setelah tanda titik dua (:) harus ada alamat sel lain, misalnya A1:B5.');return{t:'rng',a:k.v,b:k2.v}}return{t:'ref',a:k.v}}
  if(k.k=='i'){if(isO('(')){nx();const a=[];if(isO(')')){nx();return{t:'fn',n:k.v.toUpperCase(),a}}
    for(;;){a.push(cmp());if(!pk())throw new FErr('#SYNTAX','Jumlah kurung buka dan tutup belum sama.');if(isO(',')||isO(';')){nx();continue}if(isO(')')){nx();break}throw new FErr('#SYNTAX','Antar argumen harus dipisah ; atau , dan diakhiri kurung tutup.')}
    return{t:'fn',n:k.v.toUpperCase(),a}}
   const u=k.v.toUpperCase();if(u=='TRUE')return{t:'b',v:true};if(u=='FALSE')return{t:'b',v:false};
   throw new FErr('#NAME?','"'+k.v+'" tidak dikenali. Jika maksudnya teks, apit dengan tanda kutip, misalnya "'+k.v+'".')}
  if(k.k=='o'&&k.v=='('){const e=cmp();if(!isO(')'))throw new FErr('#SYNTAX','Kurung buka belum ditutup.');nx();return e}
  throw new FErr('#SYNTAX','Tanda "'+k.v+'" tidak diharapkan di posisi ini.')}
 const e=cmp();if(p<t.length)throw new FErr('#SYNTAX',t[p].v==')'?'Ada kurung tutup yang berlebih.':'Ada bagian rumus yang tidak dikenali dekat "'+t[p].v+'".');return e}
const addr=a=>{const m=/^([A-Z]+)(\d+)$/.exec(a);return[+m[2]-1,colN(m[1])]};
const sc=x=>x&&x.rng?x.rows[0][0]:x;
function num(x){if(x===null)return 0;if(typeof x=='number')return x;if(typeof x=='boolean')return x?1:0;
 if(/^\s*-?\d+(\.\d+)?\s*$/.test(x))return parseFloat(x);throw new FErr('#VALUE!','Operasi hitung tidak bisa dipakai pada teks "'+x+'".')}
const str=v=>v===null?'':typeof v=='boolean'?(v?'TRUE':'FALSE'):typeof v=='number'?fmtN(v):String(v);
const rank=v=>typeof v=='number'?0:typeof v=='string'?1:2;
function cmpv(a,b){if(a===null)a=typeof b=='string'?'':typeof b=='boolean'?false:0;if(b===null)b=typeof a=='string'?'':typeof a=='boolean'?false:0;
 const ra=rank(a),rb=rank(b);if(ra!=rb)return ra-rb;if(ra==0)return a-b<-1e-9?-1:a-b>1e-9?1:0;
 if(ra==1){const x=a.toLowerCase(),y=b.toLowerCase();return x<y?-1:x>y?1:0}return(a?1:0)-(b?1:0)}
function bin(o,a,b){
 if(o=='&')return str(a)+str(b);
 if(['=','<>','<','>','<=','>='].includes(o)){const c=cmpv(a,b);return{'=':c==0,'<>':c!=0,'<':c<0,'>':c>0,'<=':c<=0,'>=':c>=0}[o]}
 const x=num(a),y=num(b);
 switch(o){case'+':return x+y;case'-':return x-y;case'*':return x*y;case'/':if(y==0)throw new FErr('#DIV/0!','Pembagian dengan nol.');return x/y;case'^':return Math.pow(x,y)}}
function ev(n,sh){
 switch(n.t){
 case'n':case's':case'b':return n.v;
 case'ref':{const[r,c]=addr(n.a);const v=sh.val(r,c);if(isErr(v))throw new FErr(v.err,v.msg);return v}
 case'rng':{const[r1,c1]=addr(n.a),[r2,c2]=addr(n.b);const rows=[];
  for(let r=Math.min(r1,r2);r<=Math.max(r1,r2);r++){const row=[];for(let c=Math.min(c1,c2);c<=Math.max(c1,c2);c++){const v=sh.val(r,c);if(isErr(v))throw new FErr(v.err,v.msg);row.push(v)}rows.push(row)}
  return{rng:1,rows}}
 case'neg':return -num(sc(ev(n.e,sh)));
 case'bin':return bin(n.o,sc(ev(n.l,sh)),sc(ev(n.r,sh)));
 case'fn':{const f=FN[n.n];if(!f)throw new FErr('#NAME?','Fungsi '+n.n+' tidak dikenali. Periksa ejaan namanya.');return f(n.a,x=>ev(x,sh))}}}
function mkSheet(raw){const memo=new Map(),busy=new Set();
 const sh={raw,val(r,c){const v=raw[r]&&raw[r][c];if(v===undefined||v===null||v==='')return null;
  if(typeof v=='string'&&v[0]=='='){const k=r+','+c;if(memo.has(k))return memo.get(k);
   if(busy.has(k))return{err:'#REF!',msg:'Rumus merujuk ke dirinya sendiri.'};
   busy.add(k);let out;try{out=sc(ev(parse(tokenize(v.slice(1))),sh));if(out===undefined)out=null}catch(e){if(e instanceof FErr)out={err:e.code,msg:e.msg};else throw e}
   busy.delete(k);memo.set(k,out);return out}
  return v}};return sh}
function calc(f,sh){try{f=f.trim();if(f[0]!='=')throw new FErr('#SYNTAX','Rumus di Excel selalu diawali tanda sama dengan (=).');
 const v=sc(ev(parse(tokenize(f.slice(1))),sh));return{v:v===undefined?null:v}}catch(e){if(e instanceof FErr)return{err:e.code,msg:e.msg};throw e}}
function mt(v,c){
 if(typeof c=='number')return typeof v=='number'&&Math.abs(v-c)<1e-9;

ch:[
{q:'Di sel C2, tulis <b>"Tuntas"</b> jika nilai Aisyah (B2) minimal 75, selain itu <b>"Belum Tuntas"</b>.',a:'=IF(B2>=75;"Tuntas";"Belum Tuntas")',need:['IF'],h:['Syaratnya membandingkan B2 dengan 75. "Minimal 75" berarti 75 atau lebih.','IF punya tiga bagian: syarat, hasil jika benar, hasil jika salah. Pisahkan dengan ; atau ,','=IF(B2>=75; "Tuntas"; "Belum Tuntas")'],w:'Syarat B2>=75 benar menghasilkan Tuntas.'},
{q:'Beri predikat Citra (B4): <b>"A"</b> jika nilai minimal 90, <b>"B"</b> jika minimal 80, selain itu <b>"C"</b>.',a:'=IF(B4>=90;"A";IF(B4>=80;"B";"C"))',need:['IF'],h:['Ada tiga hasil, jadi butuh dua IF.','Periksa syarat tertinggi dulu (>=90). Bagian "jika salah" diisi IF kedua.','=IF(B4>=90;"A";IF(B4>=80;"B";"C")) dan jangan lupa dua kurung tutup.'],w:'IF kedua berada di dalam bagian jika-salah IF pertama.'},
{q:'Tulis <b>"Baik"</b> jika rata-rata kelas (B2:B9) minimal 75, selain itu <b>"Perlu Remedial"</b>.',a:'=IF(AVERAGE(B2:B9)>=75;"Baik";"Perlu Remedial")',need:['IF','AVERAGE'],h:['Syarat IF boleh berupa hasil fungsi lain.','Bandingkan AVERAGE(B2:B9) dengan 75.','=IF(AVERAGE(B2:B9)>=75; "Baik"; "Perlu Remedial")'],w:'Fungsi di dalam fungsi menghitung dulu rata-ratanya, lalu IF memutuskan.'},
{q:'Fajar (B7) mendapat <b>"Pengayaan"</b> jika nilainya minimal 85 <b>dan</b> kurang dari 95, selain itu <b>"Reguler"</b>.',a:'=IF(AND(B7>=85;B7<95);"Pengayaan";"Reguler")',need:['IF','AND'],h:['Ada dua syarat yang harus benar sekaligus. Fungsi apa yang menggabungkan syarat?','AND(syarat1; syarat2) dipakai sebagai syarat di dalam IF.','=IF(AND(B7>=85; B7<95); "Pengayaan"; "Reguler")'],w:'AND bernilai benar hanya jika kedua syarat benar.'}]},
{id:'l5',lv:3,t:'VLOOKUP: Mencari ke Bawah',goal:'Mengambil data dari tabel acuan dengan kunci pencarian di kolom paling kiri.',
theory:`<p>Bayangkan daftar harga koperasi. Saat ada pesanan berisi kode barang, kamu ingin nama dan harganya muncul otomatis. Itu tugas <code>VLOOKUP</code> (<i>vertical lookup</i>).</p>
<div class="syn">=VLOOKUP(kunci; tabel; nomor_kolom; FALSE)</div>
<table class="tbl"><tr><th>Bagian</th><th>Isinya</th></tr><tr><td>kunci</td><td>nilai yang dicari, misalnya kode K03 atau sel E2</td></tr><tr><td>tabel</td><td>rentang acuan; kunci harus berada di <b>kolom paling kiri</b></td></tr><tr><td>nomor_kolom</td><td>urutan kolom di dalam tabel yang ingin diambil (kolom pertama = 1)</td></tr><tr><td>FALSE</td><td>cari yang persis sama. Hampir selalu dipakai.</td></tr></table>
<div class="note"><b>Tips</b>Kunci tabel dengan tanda $ (misalnya <code>$A$2:$C$7</code>) agar rentang tidak bergeser saat rumus disalin ke bawah.</div>
<div class="pit"><b>Hati-hati</b>Nomor kolom dihitung dari awal tabel yang kamu pilih, bukan dari kolom A lembar kerja.</div>`,
data:[['Kode','Nama Barang','Harga','','Kode Dipesan','Nama Barang','Harga'],['K01','Pensil',2000,'','K04'],['K02','Penghapus',3000,'','K01'],['K03','Penggaris',4500,'','K06'],['K04','Buku Tulis',5000],['K05','Pulpen',3500],['K06','Spidol',8000]],mut:'C',
ch:[
{q:'Cari <b>nama barang</b> untuk kode <b>"K03"</b> dari tabel A2:C7.',a:'=VLOOKUP("K03";A2:C7;2;FALSE)',need:['VLOOKUP'],h:['Kunci pencarian adalah teks K03, jadi ditulis dengan tanda kutip.','Tabelnya A2:C7. Nama barang berada di kolom ke-2 tabel.','=VLOOKUP("K03"; A2:C7; 2; FALSE)'],w:'Kolom ke-2 tabel (Nama Barang) pada baris yang kodenya K03.'},
{q:'Cari <b>harga</b> barang yang kodenya ada di sel <b>E2</b>.',a:'=VLOOKUP(E2;A2:C7;3;FALSE)',need:['VLOOKUP'],h:['Kunci tidak perlu diketik. Tunjuk saja selnya.','Harga ada di kolom ke-3 dari tabel A2:C7.','=VLOOKUP(E2; A2:C7; 3; FALSE)'],w:'Kunci diambil dari sel E2 (K04), harga ada di kolom ke-3.'},
{q:'Cari <b>nama barang</b> untuk kode di <b>E3</b>, dengan rentang tabel dikunci memakai tanda <b>$</b>.',a:'=VLOOKUP(E3;$A$2:$C$7;2;FALSE)',need:['VLOOKUP'],h:['Tanda $ dipasang pada huruf dan angka sel: $A$2.','Tabel dikunci menjadi $A$2:$C$7. Nama barang ada di kolom ke-2.','=VLOOKUP(E3; $A$2:$C$7; 2; FALSE)'],w:'$ mengunci alamat agar tidak bergeser saat disalin.'},
{q:'Hitung <b>total bayar</b> untuk tiga kode pesanan di E2, E3, dan E4 (harga ketiganya dijumlahkan).',a:'=VLOOKUP(E2;A2:C7;3;FALSE)+VLOOKUP(E3;A2:C7;3;FALSE)+VLOOKUP(E4;A2:C7;3;FALSE)',need:['VLOOKUP'],h:['Cari harga tiap kode, lalu jumlahkan hasilnya.','Satu VLOOKUP untuk tiap sel kode. Sambungkan dengan +.','VLOOKUP(E2;...;3;FALSE) + VLOOKUP(E3;...) + VLOOKUP(E4;...)'],w:'Tiga VLOOKUP harga dijumlahkan. Di materi berikutnya kamu akan belajar cara yang lebih ringkas.'},
{q:'Kode <b>"K09"</b> tidak ada di tabel. Buat rumus yang menampilkan teks <b>"Tidak ada"</b> sebagai ganti pesan galat #N/A.',a:'=IFERROR(VLOOKUP("K09";A2:C7;2;FALSE);"Tidak ada")',need:['IFERROR','VLOOKUP'],h:['Fungsi IFERROR menangkap galat dan menggantinya dengan nilai lain.','IFERROR(rumus_utama; nilai_jika_galat). Rumus utamanya VLOOKUP untuk K09.','=IFERROR(VLOOKUP("K09"; A2:C7; 2; FALSE); "Tidak ada")'],w:'Bila VLOOKUP gagal (#N/A), IFERROR menampilkan teks pengganti.'}]},
{id:'l6',lv:3,t:'HLOOKUP: Mencari ke Samping',goal:'Mengambil data dari tabel yang kunci pencariannya berada pada baris judul paling atas.',
theory:`<p><code>HLOOKUP</code> (<i>horizontal lookup</i>) sama seperti VLOOKUP, tetapi tabelnya mendatar. Kunci dicari di <b>baris pertama</b>, lalu hasilnya diambil dari baris ke sekian.</p>
<div class="syn">=HLOOKUP(kunci; tabel; nomor_baris; FALSE)</div>
<p>Pada tabel kas di bawah, nama bulan ada di baris 1. Tabel acuannya <code>B1:E4</code>, dengan Pemasukan di baris ke-2, Pengeluaran ke-3, dan Saldo ke-4 dari tabel.</p>
<div class="note"><b>Info</b>Sel Saldo berisi rumus (pemasukan dikurangi pengeluaran). Klik salah satunya untuk melihat rumusnya, lalu ubah angka pemasukan dan lihat Saldo ikut berubah.</div>`,
data:[['Keterangan','Agustus','September','Oktober','November','','','Bulan dicari'],['Pemasukan',150000,160000,170000,155000,'','','September'],['Pengeluaran',100000,120000,90000,110000],['Saldo','=B2-B3','=C2-C3','=D2-D3','=E2-E3']],mut:'BCDE',
ch:[
{q:'Cari <b>pemasukan bulan Oktober</b>.',a:'=HLOOKUP("Oktober";B1:E4;2;FALSE)',need:['HLOOKUP'],h:['Kunci "Oktober" dicari di baris judul bulan.','Tabelnya B1:E4. Pemasukan ada di baris ke-2 tabel.','=HLOOKUP("Oktober"; B1:E4; 2; FALSE)'],w:'Baris ke-2 tabel adalah Pemasukan.'},
{q:'Cari <b>pengeluaran</b> pada bulan yang tertulis di sel <b>H2</b>.',a:'=HLOOKUP(H2;B1:E4;3;FALSE)',need:['HLOOKUP'],h:['Gunakan sel H2 sebagai kunci, bukan teks.','Pengeluaran berada di baris ke-3 tabel.','=HLOOKUP(H2; B1:E4; 3; FALSE)'],w:'Kunci diambil dari H2 sehingga mengikuti bulan yang ditulis di sana.'},
{q:'Cari <b>saldo bulan November</b>.',a:'=HLOOKUP("November";B1:E4;4;FALSE)',need:['HLOOKUP'],h:['Saldo ada di baris paling bawah tabel.','Menghitung dari baris judul: judul=1, Pemasukan=2, Pengeluaran=3, Saldo=?','=HLOOKUP("November"; B1:E4; 4; FALSE)'],w:'Saldo adalah baris ke-4 tabel.'},
{q:'Hitung <b>selisih pemasukan dan pengeluaran</b> pada bulan di H2 dengan dua HLOOKUP.',a:'=HLOOKUP(H2;B1:E4;2;FALSE)-HLOOKUP(H2;B1:E4;3;FALSE)',need:['HLOOKUP'],h:['Ambil pemasukan dan pengeluaran, lalu kurangkan.','Dua HLOOKUP dengan kunci sama, nomor barisnya berbeda (2 dan 3).','=HLOOKUP(H2;B1:E4;2;FALSE) - HLOOKUP(H2;B1:E4;3;FALSE)'],w:'Hasilnya sama dengan Saldo bulan itu.'}]},
{id:'l7',lv:3,t:'MATCH: Mencari Posisi',goal:'Menemukan urutan suatu nilai di dalam daftar, sebagai bahan untuk INDEX.',
theory:`<p><code>MATCH</code> tidak mengambil isi data. Ia memberi tahu <b>urutan ke berapa</b> sebuah nilai berada di dalam rentang satu kolom atau satu baris.</p>
<div class="syn">=MATCH(nilai_dicari; rentang; 0)<small>Angka 0 berarti cocok persis.</small></div>
<p>Contoh: pada <code>B2:B8</code> berisi 1001 sampai 1007, <code>=MATCH(1003;B2:B8;0)</code> menghasilkan <b>3</b> karena 1003 ada di urutan ke-3, bukan di baris 3.</p>
<div class="pit"><b>Hati-hati</b>Hasil MATCH dihitung dari awal rentang. Jika rentangmu mulai dari baris 2, urutan 1 berarti baris 2.</div>`,
data:SISWA,mut:'D',
ch:[
{q:'Cari urutan <b>NIS 1004</b> pada kolom NIS (B2:B8).',a:'=MATCH(1004;B2:B8;0)',need:['MATCH'],h:['Fungsi yang mencari urutan adalah MATCH.','Rentangnya hanya kolom NIS: B2:B8. Gunakan 0 sebagai tipe pencocokan.','=MATCH(1004; B2:B8; 0)'],w:'1004 berada di urutan ke-4 pada B2:B8.'},
{q:'Cari urutan nama <b>"Gita"</b> pada kolom Nama (A2:A8).',a:'=MATCH("Gita";A2:A8;0)',need:['MATCH'],h:['Teks harus diapit tanda kutip.','Rentang pencarian adalah kolom Nama.','=MATCH("Gita"; A2:A8; 0)'],w:'Gita adalah siswa urutan ke-7.'},
{q:'Cari urutan NIS yang tertulis di sel <b>H2</b>.',a:'=MATCH(H2;B2:B8;0)',need:['MATCH'],h:['Kunci diambil dari sel, tidak diketik.','Cari H2 di kolom NIS.','=MATCH(H2; B2:B8; 0)'],w:'Kunci berasal dari H2.'},
{q:'Cari <b>urutan nilai tertinggi</b> di kolom Nilai (D2:D8).',a:'=MATCH(MAX(D2:D8);D2:D8;0)',need:['MATCH','MAX'],h:['Cari dulu nilai tertingginya dengan MAX.','Hasil MAX menjadi nilai_dicari di dalam MATCH.','=MATCH(MAX(D2:D8); D2:D8; 0)'],w:'MAX menghasilkan nilai terbesar, MATCH mencari urutannya.'}]},
{id:'l8',lv:3,t:'INDEX: Mengambil Berdasarkan Urutan',goal:'Mengambil isi sel dari suatu rentang berdasarkan nomor baris dan kolom.',
theory:`<p><code>INDEX</code> kebalikan dari MATCH: kamu memberi nomor urutan, ia memberikan isinya.</p>
<div class="syn">=INDEX(rentang; nomor_baris)
=INDEX(tabel; nomor_baris; nomor_kolom)<small>Untuk satu kolom, cukup nomor baris. Untuk tabel banyak kolom, tambahkan nomor kolom.</small></div>
<p><code>=INDEX(A2:A8;3)</code> memberi isi urutan ke-3 pada A2:A8, yaitu "Citra". Pada tabel <code>A2:D8</code>, <code>=INDEX(A2:D8;3;4)</code> mengambil baris ke-3 kolom ke-4, yaitu nilai Citra.</p>`,
data:SISWA,mut:'D',
ch:[
{q:'Ambil <b>nama siswa urutan ke-3</b> dari kolom Nama.',a:'=INDEX(A2:A8;3)',need:['INDEX'],h:['Satu kolom saja, jadi cukup nomor baris.','Rentang: A2:A8.','=INDEX(A2:A8; 3)'],w:'Urutan ke-3 pada A2:A8 adalah Citra.'},
{q:'Ambil <b>nilai siswa urutan ke-5</b> dari kolom Nilai.',a:'=INDEX(D2:D8;5)',need:['INDEX'],h:['Nilai ada di kolom D.','Rentang: D2:D8, nomor urut 5.','=INDEX(D2:D8; 5)'],w:'Urutan ke-5 adalah Eka.'},
{q:'Dari seluruh tabel <b>A2:D8</b>, ambil isi <b>baris ke-4 dan kolom ke-4</b>.',a:'=INDEX(A2:D8;4;4)',need:['INDEX'],h:['Tabel banyak kolom butuh nomor baris dan nomor kolom.','Baris ke-4 lalu kolom ke-4 (Nilai adalah kolom ke-4).','=INDEX(A2:D8; 4; 4)'],w:'Baris ke-4 adalah Dimas dan kolom ke-4 adalah Nilai.'}]},
{id:'l9',lv:3,t:'INDEX dan MATCH Bersama',goal:'Menggabungkan MATCH dan INDEX untuk mencari data ke arah mana pun, bahkan ke kiri.',
theory:`<p>MATCH menemukan <b>urutan</b>, INDEX mengambil <b>isi</b> pada urutan itu. Keduanya digabung menjadi pencarian yang fleksibel.</p>
<div class="syn">=INDEX(rentang_hasil; MATCH(kunci; rentang_kunci; 0))</div>
<h4>Mengapa tidak cukup VLOOKUP?</h4>
<p>Pada tabel ini, NIS ada di kolom B, sedangkan Nama ada di kolom A (di kiri NIS). VLOOKUP tidak bisa mengambil data di sebelah kiri kunci. INDEX dan MATCH bisa, karena rentang kunci dan rentang hasil ditulis terpisah.</p>
<p>Cara membacanya dari dalam ke luar: MATCH mencari urutan NIS pada B2:B8, lalu INDEX mengambil isi urutan yang sama dari A2:A8.</p>`,
data:SISWA,mut:'D',
ch:[
{q:'Tampilkan <b>nama siswa</b> yang NIS-nya ada di sel <b>H2</b>.',a:'=INDEX(A2:A8;MATCH(H2;B2:B8;0))',need:['INDEX','MATCH'],h:['Dua langkah: cari urutan NIS, lalu ambil nama pada urutan itu.','MATCH mencari H2 di B2:B8. INDEX mengambil dari A2:A8.','=INDEX(A2:A8; MATCH(H2; B2:B8; 0))'],w:'MATCH memberi urutan 5, INDEX mengambil Eka.'},
{q:'Tampilkan <b>nilai</b> siswa bernama <b>"Fajar"</b>.',a:'=INDEX(D2:D8;MATCH("Fajar";A2:A8;0))',need:['INDEX','MATCH'],h:['Kali ini kuncinya nama dan hasilnya nilai.','MATCH mencari "Fajar" di A2:A8, INDEX mengambil dari D2:D8.','=INDEX(D2:D8; MATCH("Fajar"; A2:A8; 0))'],w:'Rentang kunci dan rentang hasil boleh berbeda kolom.'},
{q:'Tampilkan <b>kelas</b> siswa dengan <b>NIS 1006</b>.',a:'=INDEX(C2:C8;MATCH(1006;B2:B8;0))',need:['INDEX','MATCH'],h:['Kunci: 1006 di kolom NIS.','Hasil yang diambil dari kolom Kelas (C2:C8).','=INDEX(C2:C8; MATCH(1006; B2:B8; 0))'],w:'Kelas ada di kolom C.'},
{q:'<b>Tantangan:</b> tampilkan nama siswa yang memiliki <b>nilai tertinggi</b>.',a:'=INDEX(A2:A8;MATCH(MAX(D2:D8);D2:D8;0))',need:['INDEX','MATCH','MAX'],h:['Tiga langkah: nilai tertinggi, urutannya, lalu nama pada urutan itu.','MAX(D2:D8) menjadi kunci MATCH di D2:D8. Hasilnya dipakai INDEX pada A2:A8.','=INDEX(A2:A8; MATCH(MAX(D2:D8); D2:D8; 0))'],w:'MAX, MATCH, dan INDEX bekerja berantai.'}]},
{id:'l10',lv:3,t:'CHOOSE: Memilih dari Daftar',goal:'Mengubah nomor kode menjadi teks atau nilai pilihan dengan satu fungsi.',
theory:`<p><code>CHOOSE</code> memilih satu isi dari daftar berdasarkan <b>nomor urut</b>. Cocok untuk data yang disimpan sebagai kode angka.</p>
<div class="syn">=CHOOSE(nomor; pilihan1; pilihan2; pilihan3; ...)<small>Nomor 1 mengambil pilihan1, nomor 2 mengambil pilihan2, dan seterusnya.</small></div>
<p>Contoh: <code>=CHOOSE(2;"Merah";"Kuning";"Hijau")</code> menghasilkan Kuning.</p>
<p>Daftar yang dipakai di latihan ini:</p>
<table class="tbl"><tr><th>Hari piket (angka)</th><td>1 Senin, 2 Selasa, 3 Rabu, 4 Kamis, 5 Jumat</td></tr><tr><th>Nilai sikap (angka)</th><td>1 Kurang, 2 Cukup, 3 Baik, 4 Sangat Baik</td></tr></table>
<div class="pit"><b>Hati-hati</b>Jika nomor lebih besar dari jumlah pilihan, hasilnya galat #VALUE!.</div>`,
data:[['Nama','Hari Piket','Nilai Sikap'],['Aisyah',3,3],['Budi',1,2],['Citra',5,4],['Dimas',2,1],['Eka',4,3],['Fajar',3,2]],
alt:d=>d.map((r,i)=>i?[r[0],(r[1]%5)+1,(r[2]%4)+1]:r),
ch:[
{q:'Tampilkan nama hari untuk nomor <b>3</b>, dengan CHOOSE dan daftar Senin sampai Jumat.',a:'=CHOOSE(3;"Senin";"Selasa";"Rabu";"Kamis";"Jumat")',need:['CHOOSE'],h:['Nomor ditulis pertama, lalu daftar pilihan berurutan.','Pilihannya: "Senin", "Selasa", "Rabu", "Kamis", "Jumat", masing-masing diapit kutip.','=CHOOSE(3; "Senin"; "Selasa"; "Rabu"; "Kamis"; "Jumat")'],w:'Pilihan ke-3 adalah Rabu.'},
{q:'Tampilkan <b>nama hari piket Budi</b> dengan membaca nomornya di sel <b>B3</b>.',a:`=CHOOSE(B3;${HARI5})`,need:['CHOOSE'],h:['Nomor tidak diketik, tetapi diambil dari sel.','Ganti angka pertama dengan B3.','=CHOOSE(B3; "Senin"; "Selasa"; "Rabu"; "Kamis"; "Jumat")'],w:'Nomor dibaca dari B3, jadi rumus mengikuti datanya.'},
{q:'Tampilkan <b>predikat sikap Citra</b> (nomor di C4): Kurang, Cukup, Baik, Sangat Baik.',a:'=CHOOSE(C4;"Kurang";"Cukup";"Baik";"Sangat Baik")',need:['CHOOSE'],h:['Daftar pilihan ada empat, urut dari nomor 1.','Nomor berasal dari C4.','=CHOOSE(C4; "Kurang"; "Cukup"; "Baik"; "Sangat Baik")'],w:'Nomor sikap diubah menjadi kata.'},
{q:'<b>Tantangan:</b> untuk Aisyah (baris 2), tampilkan teks gabungan seperti <b>Rabu - Baik</b> (hari piket, spasi, tanda hubung, spasi, predikat sikap).',a:`=CHOOSE(B2;${HARI5})&" - "&CHOOSE(C2;"Kurang";"Cukup";"Baik";"Sangat Baik")`,need:['CHOOSE'],h:['Dua CHOOSE harus disambung dengan operator penggabung teks &.','Hari dari B2, predikat dari C2, dan di antaranya teks " - ".','=CHOOSE(B2; ...hari...) & " - " & CHOOSE(C2; ...sikap...)'],w:'Operator & menyambung beberapa teks menjadi satu.'}]},
{id:'l11',lv:4,t:'COUNTIF dan SUMIF: Satu Syarat',goal:'Menghitung dan menjumlahkan hanya data yang memenuhi satu syarat.',
theory:`<p>Kadang kita hanya ingin menghitung sebagian data, misalnya "berapa menu Makanan?". Dua fungsi ini memakai <b>kriteria</b>.</p>
<div class="syn">=COUNTIF(rentang_kriteria; kriteria)
=SUMIF(rentang_kriteria; kriteria; rentang_jumlah)<small>COUNTIF menghitung banyak baris. SUMIF menjumlahkan kolom lain pada baris yang cocok.</small></div>
<table class="tbl"><tr><th>Kriteria</th><th>Artinya</th></tr><tr><td><code>"Makanan"</code></td><td>sama dengan teks Makanan</td></tr><tr><td><code>"&gt;=25"</code></td><td>angka 25 atau lebih (operator ikut di dalam kutip)</td></tr><tr><td><code>"&lt;&gt;Senin"</code></td><td>bukan Senin</td></tr><tr><td><code>H2</code></td><td>isi sel H2 (tanpa kutip)</td></tr></table>
<p>Kolom Omzet pada tabel berisi rumus <code>=Harga*Terjual</code>. Klik salah satunya untuk melihat.</p>`,
data:KANTIN,mut:'DE',
ch:[
{q:'Hitung <b>banyak baris</b> penjualan berkategori <b>Makanan</b>.',a:'=COUNTIF(B2:B13;"Makanan")',need:['COUNTIF'],h:['Yang diminta banyaknya baris, bukan jumlah angka.','Rentang kriteria adalah kolom Kategori (B2:B13).','=COUNTIF(B2:B13; "Makanan")'],w:'COUNTIF menghitung sel kategori yang sama dengan Makanan.'},
{q:'Hitung <b>total terjual</b> untuk kategori <b>Minuman</b>.',a:'=SUMIF(B2:B13;"Minuman";E2:E13)',need:['SUMIF'],h:['Syarat ada di Kategori, yang dijumlahkan adalah Terjual.','SUMIF urutannya: rentang syarat, syarat, rentang yang dijumlahkan.','=SUMIF(B2:B13; "Minuman"; E2:E13)'],w:'Jumlahkan Terjual hanya pada baris yang kategorinya Minuman.'},
{q:'Hitung banyak baris yang <b>terjual 25 atau lebih</b>.',a:'=COUNTIF(E2:E13;">=25")',need:['COUNTIF'],h:['Syaratnya berupa perbandingan angka pada kolom Terjual.','Operator perbandingan ditulis di dalam tanda kutip bersama angkanya.','=COUNTIF(E2:E13; ">=25")'],w:'">=25" berarti 25 atau lebih.'},
{q:'Hitung <b>omzet</b> (kolom F) pada hari <b>Rabu</b>.',a:'=SUMIF(C2:C13;"Rabu";F2:F13)',need:['SUMIF'],h:['Syarat ada di kolom Hari, yang dijumlahkan kolom Omzet.','Rentang syarat C2:C13, rentang jumlah F2:F13.','=SUMIF(C2:C13; "Rabu"; F2:F13)'],w:'Omzet seluruh penjualan hari Rabu dijumlahkan.'},

 </div></section>
 <section class="sec"><h3>Tantangan</h3><div class="row" style="margin-bottom:12px"><button class="btn" data-act="resetlesson">Reset semua tantangan di materi ini</button></div>${L.ch.map((_,j)=>chHTML(L,j)).join('')}</section>
 <div class="pager">${prev?`<button class="btn" data-go="${prev.id}">← ${prev.t}</button>`:`<button class="btn" data-go="intro">← Mulai di sini</button>`}${next?`<button class="btn pri" data-go="${next.id}">${next.t} →</button>`:`<span class="cap">Kamu sudah sampai materi terakhir. Kerja bagus!</span>`}</div>`;
 paintGrid();selCell(G.sel[0],G.sel[1]);
 if(L.pivot)initPivot(L);
 document.querySelectorAll('.ch').forEach(a=>restoreHints(L,a))}

/* tabel */
function gridInit(L){const orig=clone(L.data),nC=Math.max(...orig.map(r=>r.length))+1,nR=orig.length+2,raw=[];
 for(let r=0;r<nR;r++){raw.push([]);for(let c=0;c<nC;c++)raw[r][c]=orig[r]&&orig[r][c]!==undefined?orig[r][c]:''}
 G={L,raw,orig:raw.map(r=>r.slice()),sel:[1,0],hl:new Set(),nR,nC}}
function paintGrid(){const sh=mkSheet(G.raw);let h='<table class="sg"><thead><tr><th class="rh"></th>';
 for(let c=0;c<G.nC;c++)h+=`<th>${colL(c)}</th>`;h+='</tr></thead><tbody>';
 for(let r=0;r<G.nR;r++){h+=`<tr><th class="rh">${r+1}</th>`;
  for(let c=0;c<G.nC;c++){const v=sh.val(r,c),e=isErr(v),cl=[];
   if(typeof v=='number')cl.push('n');if(r==0)cl.push('hd0');if(G.raw[r][c]!==G.orig[r][c])cl.push('us');if(e)cl.push('er');
   if(G.sel[0]==r&&G.sel[1]==c)cl.push('sel');if(G.hl.has(r+','+c))cl.push('rf');
   h+=`<td data-r="${r}" data-c="${c}" class="${cl.join(' ')}"${e?` title="${esc(v.msg)}"`:''}>${esc(show(v))}</td>`}
  h+='</tr>'}
 $('grid').innerHTML=h+'</tbody></table>'}
function selCell(r,c){G.sel=[r,c];$('nb').textContent=colL(c)+(r+1);const v=G.raw[r][c];$('fb').value=v===''?'':String(v);paintGrid()}
function commit(){const[r,c]=G.sel;let t=$('fb').value.trim();G.raw[r][c]=t===''?'':/^-?\d+(\.\d+)?$/.test(t)?parseFloat(t):t;paintGrid()}
function hlFrom(text){G.hl=new Set();(String(text).match(/\$?[A-Z]{1,2}\$?\d+(?::\$?[A-Z]{1,2}\$?\d+)?/gi)||[]).forEach(s=>{const p=s.replace(/\$/g,'').toUpperCase().split(':'),a=addr(p[0]),b=addr(p[1]||p[0]);
  for(let r=Math.min(a[0],b[0]);r<=Math.max(a[0],b[0]);r++)for(let c=Math.min(a[1],b[1]);c<=Math.max(a[1],b[1]);c++)G.hl.add(r+','+c)});paintGrid()}

/* pemeriksa rumus */
function diag(u,e){const a=u.v,b=e.v;
 if(typeof a!=typeof b)return 'Hasil rumusmu berupa '+(typeof a=='number'?'angka':'teks')+', padahal soal mengharapkan '+(typeof b=='number'?'angka':'teks')+'. Periksa lagi apa yang diminta soal.';
 if(typeof a=='number')return 'Rumusmu menghasilkan '+show(a)+', belum sesuai dengan yang diminta soal. Periksa rentang sel, syarat, dan urutan argumennya.';
 return 'Hasil rumusmu ('+show(a)+') belum sama dengan yang diminta. Periksa ejaan teks, tanda kutip, dan sel yang dipilih.'}
function verify(L,c,f){
 if(!f)return{ok:0,m:'Ketik rumusmu dulu.'};
 if(f[0]!='=')return{ok:0,m:'Rumus di Excel selalu diawali tanda sama dengan (=).'};
 const base=mkSheet(clone(L.data)),alt=mkSheet(altOf(L)),u1=calc(f,base);
 if(u1.err)return{ok:0,m:u1.err+': '+u1.msg};
 if(!/[A-Za-z]+\s*\(|\$?[A-Z]{1,2}\$?\d+/i.test(f))return{ok:0,m:'Rumus harus memakai sel atau fungsi. Jangan mengetik hasilnya langsung.'};
 for(const n of c.need||[])if(!new RegExp('\\b'+n+'\\s*\\(','i').test(f))return{ok:0,m:'Soal ini melatih fungsi '+n+'. Gunakan '+n+' di rumusmu.'};
 const e1=calc(c.a,base),e2=calc(c.a,alt),u2=calc(f,alt);
 if(same(u1,e1)&&same(u2,e2))return{ok:1};
 if(same(u1,e1))return{ok:0,m:'Hasilnya cocok di data ini, tetapi rumusmu belum berlaku umum. Cek apakah ada angka yang diketik langsung atau rentang yang kurang lengkap.'};
 return{ok:0,m:diag(u1,e1)}}

/* pivot */
const AGGL={sum:'Jumlah',avg:'Rata-rata',count:'Hitung',max:'Maks',min:'Min'};
function initPivot(L){const sh=mkSheet(clone(L.data)),H=L.data[0],tx=[],nu=[];
 H.forEach((h,c)=>{(typeof sh.val(1,c)=='number'?nu:tx).push(h)});
 $('p-row').innerHTML=tx.map(x=>`<option>${esc(x)}</option>`).join('');
 $('p-col').innerHTML='<option value="">(tidak ada)</option>'+tx.map(x=>`<option>${esc(x)}</option>`).join('');
 $('p-val').innerHTML=nu.map(x=>`<option>${esc(x)}</option>`).join('');
 $('p-row').value='Menu';$('p-val').value='Terjual';paintPivot()}
const pivotCfg=()=>({row:$('p-row').value,col:$('p-col').value,val:$('p-val').value,agg:$('p-agg').value});
function paintPivot(){const L=G.L,cfg=pivotCfg(),sh=mkSheet(clone(L.data)),H=L.data[0],rows=[];
 for(let r=1;r<L.data.length;r++)rows.push(H.map((_,c)=>sh.val(r,c)));
 const ri=H.indexOf(cfg.row),ci=cfg.col?H.indexOf(cfg.col):-1,vi=H.indexOf(cfg.val);
 const uq=i=>[...new Set(rows.map(r=>r[i]))].sort((a,b)=>String(a).localeCompare(String(b),'id'));
 const rk=uq(ri),ck=ci>=0?uq(ci):[];
 const ag=xs=>{if(!xs.length)return '';switch(cfg.agg){case'sum':return xs.reduce((s,x)=>s+x,0);case'avg':return xs.reduce((s,x)=>s+x,0)/xs.length;case'count':return xs.length;case'max':return Math.max(...xs);default:return Math.min(...xs)}};
 const cell=(rv,cv)=>{const x=ag(rows.filter(r=>(rv===null||r[ri]===rv)&&(cv===null||r[ci]===cv)).map(r=>r[vi]));return x===''?'':+Number(x).toFixed(2)};
 let h='<table class="sg pvt"><thead><tr><th class="l">'+esc(cfg.row)+'</th>';
 if(ci>=0){ck.forEach(c=>h+=`<th>${esc(c)}</th>`);h+='<th class="tot">Total</th>'}else h+=`<th class="tot">${AGGL[cfg.agg]} ${esc(cfg.val)}</th>`;
 h+='</tr></thead><tbody>';
 rk.forEach(rv=>{h+=`<tr><th class="l">${esc(rv)}</th>`;ck.forEach(cv=>h+=`<td class="n">${cell(rv,cv)}</td>`);h+=`<td class="n tot">${cell(rv,null)}</td></tr>`});
 h+='<tr><th class="l tot">Total</th>';ck.forEach(cv=>h+=`<td class="n tot">${cell(null,cv)}</td>`);h+=`<td class="n tot">${cell(null,null)}</td></tr></tbody></table>`;
 $('pvout').innerHTML=h}
function checkPivot(c){const u=pivotCfg(),t=c.cfg,bad=[];
 if(u.row!=t.row)bad.push('bidang Baris');if((u.col||'')!=(t.col||''))bad.push('bidang Kolom');
 if(!(t.agg=='count'&&u.agg=='count')&&u.val!=t.val)bad.push('bidang Nilai');if(u.agg!=t.agg)bad.push('Fungsi');
 return bad.length?{ok:0,m:'Yang belum sesuai: '+bad.join(', ')+'.'}:{ok:1}}

/* hint, jawaban, pemeriksaan */
function restoreHints(L,a){const k=a.dataset.k,n=hs[k]||0,c=L.ch[a.dataset.i];
 a.querySelector('.hints').innerHTML=c.h.slice(0,n).map((t,j)=>`<li><b>Hint ${j+1}</b>${esc(t)}</li>`).join('');
 const hb=a.querySelector('[data-act=hint]'),ab=a.querySelector('[data-act=ans]');
 hb.textContent=n>=3?'Semua hint terbuka':'Hint ('+n+'/3)';hb.disabled=n>=3;
 ab.disabled=!(n>=3||S.done[k]);ab.title=ab.disabled?'Buka ketiga hint dulu':'';
 if(a.dataset.shown){showAnswer(L,a)}}
function showAnswer(L,a){const c=L.ch[a.dataset.i],el=a.querySelector('.answer');a.dataset.shown=1;
 const cfg=c.cfg?`Baris: ${c.cfg.row} · Kolom: ${c.cfg.col||'(tidak ada)'} · Nilai: ${c.cfg.val} · Fungsi: ${AGGL[c.cfg.agg]}`:c.a;
 el.hidden=false;el.innerHTML=`<b>Salah satu jawaban yang benar:</b><code>${esc(cfg)}</code>${esc(c.w)}${c.cfg?'':' Pemisah ; boleh diganti koma.'}`}
function done(a){const k=a.dataset.k;S.done[k]=1;save();a.classList.add('done');a.querySelector('.st').textContent='✓ Selesai';renderNavKeep()}
function renderNavKeep(){const y=$('nav').scrollTop;renderNav();$('nav').scrollTop=y}
function feedback(a,r){const fb=a.querySelector('.fb');fb.hidden=false;fb.className='fb '+(r.ok?'ok':'no');
 fb.textContent=r.ok?'Benar! Rumusmu tepat dan juga bekerja pada data lain.':r.m+' Butuh bantuan? Buka Hint.';
 if(r.ok&&G.L.pivot)fb.textContent='Benar! Susunan pivotmu menjawab pertanyaan ini.'}

function resetCh(L,a){const k=a.dataset.k;delete S.done[k];hs[k]=0;delete a.dataset.shown;
 const i=a.querySelector('input[type=text]');if(i)i.value='';const pv=a.querySelector('.pv');if(pv)pv.innerHTML='';
 a.querySelector('.fb').hidden=true;a.querySelector('.answer').hidden=true;a.classList.remove('done');a.querySelector('.st').textContent='Belum selesai';
 save();restoreHints(L,a)}
const main=$('main');
main.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
 const td=e.target.closest('#grid td');if(td){selCell(+td.dataset.r,+td.dataset.c);return}
 if(e.target.id=='rs'){const L=G.L;gridInit(L);paintGrid();selCell(1,0);return}
 if(e.target.dataset.act=='resetlesson'){document.querySelectorAll('.ch').forEach(x=>resetCh(G.L,x));hlFrom('');renderNavKeep();return}
 const a=e.target.closest('.ch');if(!a)return;const L=G.L;
 const ins=e.target.closest('[data-ins]');if(ins){const i=a.querySelector('input[type=text]');const s=i.selectionStart??i.value.length;i.setRangeText(ins.dataset.ins,s,i.selectionEnd??s,'end');i.focus();i.dispatchEvent(new Event('input',{bubbles:true}));return}
 const act=e.target.dataset.act;if(!act)return;
 if(act=='hint'){hs[a.dataset.k]=Math.min(3,(hs[a.dataset.k]||0)+1);restoreHints(L,a)}
 if(act=='ans')showAnswer(L,a);
 if(act=='chk')runCheck(L,a);
 if(act=='reset'){resetCh(L,a);hlFrom('');renderNavKeep()}});
function runCheck(L,a){const c=L.ch[a.dataset.i];
 const r=L.pivot?checkPivot(c):verify(L,c,a.querySelector('input[type=text]').value.trim());
 feedback(a,r);if(r.ok){done(a);restoreHints(L,a)}}
main.addEventListener('input',e=>{
 if(e.target.matches('.in input')){const a=e.target.closest('.ch'),f=e.target.value.trim();hlFrom(f);
  let p='';if(f.length>1){const r=calc(f,mkSheet(clone(G.L.data)));p=r.err?(/SYNTAX|KUTIP|NAME/.test(r.err)?'Hasil sementara: (rumus belum lengkap)':'Hasil sementara: <b>'+esc(r.err)+'</b>'):'Hasil sementara: <b>'+esc(show(r.v))+'</b>'}
  a.querySelector('.pv').innerHTML=p}});
main.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.matches('.in input'))runCheck(G.L,e.target.closest('.ch'))});
main.addEventListener('change',e=>{if(e.target.id=='fb')commit();if(/^p-/.test(e.target.id||''))paintPivot()});
let rt=null;
$('rall').addEventListener('click',()=>{const b=$('rall');
 if(!rt){b.textContent='Yakin? Klik lagi untuk menghapus semua';rt=setTimeout(()=>{rt=null;b.textContent='Reset semua tantangan'},4000);return}
 clearTimeout(rt);rt=null;b.textContent='Reset semua tantangan';S.done={};for(const k in hs)delete hs[k];save();go(S.cur)});
$('nav').addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)go(g.dataset.go)});
let h0='';try{h0=location.hash.slice(1)}catch(e){}
go(LES.some(l=>l.id==h0)||h0=='intro'?h0:(LES.some(l=>l.id==S.cur)?S.cur:'intro'));
</script>
</body></html>
