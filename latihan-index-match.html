<h1>🧭 Latihan INDEX, MATCH & CHOOSE</h1><p class="s">Ketik rumus Excel untuk menjawab 6 soal. Pemisah argumen boleh <b>;</b> atau <b>,</b>. Kalau salah, kamu akan dapat petunjuk bertahap.</p>
<div class="c t"><table id="tb"></table></div>
<div class="c"><div class="tabs" id="tabs"></div><p id="q" style="margin:0 0 .7rem;font-weight:600"></p>
<input id="f" placeholder="=INDEX(...)" autocomplete="off" autocapitalize="off" spellcheck="false">

<script>

const ALT=[["NIS","Nama","Kelas","Nilai","","Nomor hari"],[106,"Fajar","7C",91,"",3],[102,"Budi","7B",74],[105,"Eka","7B",80],[101,"Ani","7A",88],[104,"Doni","7C",70],[103,"Citra","7A",93]];
const S=[
{t:'Pada urutan ke berapa nama "Citra" berada di kolom Nama (B2:B7)?',a:'=MATCH("Citra";B2:B7;0)',f:["MATCH"],m:"Soal ini perlu fungsi MATCH, yang mencari POSISI suatu nilai.",h:["MATCH mencari posisi (urutan ke berapa) suatu nilai di dalam satu kolom atau baris.","Susunannya: MATCH(nilai_dicari; rentang_pencarian; 0). Nama siswa ada di kolom B.",'Polanya: =MATCH("Citra"; B2:B7; 0). Angka 0 berarti cari yang persis sama.']},
{t:"Tampilkan nilai pada urutan ke-4 dalam kolom Nilai (D2:D7).",a:"=INDEX(D2:D7;4)",f:["INDEX"],m:"Soal ini perlu fungsi INDEX, yang mengambil isi sel pada urutan tertentu.",h:["INDEX mengambil isi sel pada urutan tertentu dari suatu rentang.","Untuk satu kolom: INDEX(rentang; nomor_urut). Kolom Nilai adalah D2:D7.","Polanya: =INDEX(D2:D7; 4)."]},
{t:"Ambil isi sel pada baris ke-5 dan kolom ke-3 dari tabel A2:D7.",a:"=INDEX(A2:D7;5;3)",f:["INDEX"],m:"Soal ini perlu fungsi INDEX dengan nomor baris dan nomor kolom.",h:["Untuk tabel banyak kolom, INDEX butuh dua nomor: INDEX(tabel; nomor_baris; nomor_kolom).","Hitung dari sel PERTAMA rentang: A2 adalah baris 1, kolom 1 (bukan baris 2).","Polanya: =INDEX(A2:D7; 5; 3)."]},
{t:'Tampilkan nilai milik Doni dengan menggabungkan INDEX dan MATCH (jangan menghitung posisinya sendiri).',a:'=INDEX(D2:D7;MATCH("Doni";B2:B7;0))',f:["INDEX","MATCH"],m:"Soal ini perlu INDEX dan MATCH digabung: MATCH mencari posisi Doni, INDEX mengambil nilainya.",h:["MATCH boleh ditaruh di dalam INDEX sebagai nomor urutnya.",'MATCH("Doni"; B2:B7; 0) memberi posisi, lalu INDEX(D2:D7; posisi) mengambil nilainya.','Polanya: =INDEX(D2:D7; MATCH("Doni"; B2:B7; 0)).']},
{t:"Sel F2 berisi nomor hari (1 = Senin, 2 = Selasa, 3 = Rabu). Tampilkan nama harinya dengan CHOOSE, merujuk sel F2.",a:'=CHOOSE(F2;"Senin";"Selasa";"Rabu")',f:["CHOOSE"],m:"Soal ini perlu fungsi CHOOSE.",h:["CHOOSE memilih satu nilai dari daftar berdasarkan nomor urutnya.","Susunannya: CHOOSE(nomor; nilai1; nilai2; nilai3). Nomornya ada di sel F2.",'Polanya: =CHOOSE(F2; "Senin"; "Selasa"; "Rabu").']},
{t:"Tampilkan nilai siswa dengan NIS 105 memakai INDEX dua arah: nomor baris dicari dengan MATCH pada kolom NIS, kolom yang diambil adalah Nilai.",a:"=INDEX(A2:D7;MATCH(105;A2:A7;0);4)",f:["INDEX","MATCH"],m:"Soal ini perlu INDEX dua arah dengan MATCH untuk menentukan nomor barisnya.",h:["Gabungkan INDEX (baris dan kolom) dengan MATCH untuk menentukan nomor barisnya.","Nomor baris: MATCH(105; A2:A7; 0). Nomor kolom Nilai, dihitung dari kolom A, adalah ke-4.","Polanya: =INDEX(A2:D7; MATCH(105; A2:A7; 0); 4)."]}];
const col=c=>c.toUpperCase().charCodeAt(0)-65;
const rg=s=>{const m=s.replace(/\$/g,"").match(/^([A-Z])(\d+)(?::([A-Z])(\d+))?$/i);return m&&{c1:col(m[1]),r1:+m[2],c2:col(m[3]||m[1]),r2:+(m[4]||m[2])}};
const nm=v=>typeof v=="number",low=v=>String(v).toLowerCase();
const eq=(a,b)=>nm(a)&&nm(b)?a==b:low(a)==low(b),le=(a,b)=>nm(a)&&nm(b)?a<=b:low(a)<=low(b);
function parse(s){let i=0;const ws=()=>{while(s[i]==" ")i++};
function ex(){ws();const r=s.slice(i);let m;
if(s[i]=='"'){const j=s.indexOf('"',i+1);const v=s.slice(i+1,j);i=j+1;return{t:"v",v}}
if(m=r.match(/^-?\d+(\.\d+)?(?![\w$])/)){i+=m[0].length;return{t:"v",v:+m[0]}}
if(m=r.match(/^([A-Za-z]+)\s*\(/)){i+=m[0].length;const a=[],n=m[1].toUpperCase();ws();if(s[i]==")"){i++;return{t:"f",n,a}}
for(;;){a.push(ex());ws();if(s[i]==";"||s[i]==","){i++;continue}if(s[i]==")"){i++;break}throw"Ada pemisah argumen atau kurung yang kurang pada rumus."}
return{t:"f",n,a}}
if(m=r.match(/^\$?[A-Za-z]\$?\d+(:\$?[A-Za-z]\$?\d+)?/)){i+=m[0].length;return{t:"r",g:rg(m[0])}}
if(m=r.match(/^[A-Za-z_]+/))throw`"${m[0]}" dikenali sebagai nama, bukan teks. Teks harus diapit tanda kutip, misalnya "${m[0]}".`;
throw"Ada bagian rumus yang tidak dikenali. Periksa tanda baca dan penulisannya."}
const n=ex();ws();if(i<s.length)throw"Ada karakter sisa di akhir rumus. Periksa pemisah dan kurungnya.";return n}
function ev(n,d,x){
if(n.t=="v")return n.v;
if(n.t=="r"){const g=n.g;if(!g)throw"Ada referensi sel yang tidak valid.";if(g.r1==g.r2&&g.c1==g.c2)return d[g.r1-1]?.[g.c1]??"";return{g}}
const A=n.a,N=n.n;x.f.add(N);
const sc=k=>{const v=ev(A[k],d,x);if(v&&v.g)throw`Argumen ke-${k+1} berupa rentang, padahal ${N} membutuhkan satu nilai di posisi itu.`;return v};
const rr=k=>{if(A[k].t!="r"||!A[k].g)throw`Argumen ke-${k+1} pada ${N} harus berupa rentang sel, misalnya B2:B7.`;return A[k].g};
const num=(k,w)=>{const v=sc(k);if(typeof v!="number"||!Number.isInteger(v))throw`${w} harus berupa angka bulat, bukan "${v}".`;return v};
if(N=="INDEX"){if(A.length<2||A.length>3)throw"INDEX butuh 2 atau 3 argumen: INDEX(rentang; nomor_baris; [nomor_kolom]).";
const g=rr(0),nr=g.r2-g.r1+1,nc=g.c2-g.c1+1,a=num(1,"Nomor baris");
if(A.length==2){if(nr>1&&nc>1)throw"Rentang ini punya beberapa baris dan kolom: tuliskan nomor baris DAN nomor kolom, INDEX(tabel; baris; kolom).";
const L=nr==1?nc:nr;if(a<1||a>L)throw`#REF! Nomor ${a} di luar rentang (hanya ada ${L} data).`;return(nr==1?d[g.r1-1][g.c1+a-1]:d[g.r1-1+a-1][g.c1])??""}
const b=num(2,"Nomor kolom");if(a<1||a>nr||b<1||b>nc)throw`#REF! Rentang hanya punya ${nr} baris dan ${nc} kolom, tetapi kamu meminta baris ${a}, kolom ${b}.`;
return d[g.r1-1+a-1][g.c1+b-1]??""}
if(N=="MATCH"){if(A.length<2||A.length>3)throw"MATCH butuh 2 atau 3 argumen: MATCH(nilai_dicari; rentang; 0).";
const v=sc(0),g=rr(1),t=A[2]?num(2,"Argumen ke-3"):1;
if(g.r1!=g.r2&&g.c1!=g.c2)throw"Rentang pencarian MATCH harus satu kolom atau satu baris saja.";
if(t==-1)throw"Tipe -1 tidak dipakai di latihan ini. Gunakan 0 (persis).";
const H=g.r1==g.r2,L=H?g.c2-g.c1+1:g.r2-g.r1+1,key=i=>H?d[g.r1-1][g.c1+i]:d[g.r1-1+i]?.[g.c1];let h=-1;
if(t==0){for(let i=0;i<L;i++)if(eq(key(i),v)){h=i;break}}else{x.ap=1;for(let i=0;i<L;i++){const k=key(i);if(k===undefined||k==="")continue;if(le(k,v))h=i;else break}}
if(h<0)throw`#N/A Nilai "${v}" tidak ditemukan di rentang pencarian.`;return h+1}
if(N=="CHOOSE"){if(A.length<2)throw"CHOOSE butuh nomor lalu minimal satu pilihan: CHOOSE(nomor; nilai1; nilai2; ...).";
const k=num(0,"Nomor pilihan");if(k<1||k>A.length-1)throw`#VALUE! Nomor ${k} di luar daftar pilihan (hanya ada ${A.length-1} pilihan).`;return sc(k)}
throw["VLOOKUP","HLOOKUP","LOOKUP","XLOOKUP"].includes(N)?"Latihan ini khusus INDEX, MATCH, dan CHOOSE.":`Fungsi ${N} tidak dikenali (#NAME?). Cek ejaannya.`}
function run(f,d){
if(!f.startsWith("="))throw"Rumus di Excel selalu diawali tanda sama dengan (=).";
let q=0,p=0;for(const ch of f){if(ch=='"')q^=1;else if(!q){if(ch=="(")p++;if(ch==")")p--}}
if(q)throw'Tanda kutip belum ditutup. Teks ditulis seperti "Citra".';
if(p)throw"Jumlah kurung buka dan tutup belum sama.";
const a=parse(f.slice(1).trim());if(a.t!="f")throw"Rumus harus memakai fungsi (INDEX, MATCH, atau CHOOSE). Mengetik hasilnya langsung tidak dihitung.";
const x={f:new Set(),ap:0},v=ev(a,d,x);if(v&&v.g)throw"Rumus harus menghasilkan satu nilai, bukan rentang.";return{v,x}}
let cur=0,fails=[0,0,0,0,0,0],done=[0,0,0,0,0,0];const $=id=>document.getElementById(id);
function cek(f){const Q=S[cur];let r;try{r=run(f,D)}catch(e){return{ok:0,m:String(e)}}
if(!Q.f.every(n=>r.x.f.has(n)))return{ok:0,m:Q.m};
const e1=run(Q.a,D).v,e2=run(Q.a,ALT).v;let r2;try{r2=run(f,ALT).v}catch(e){r2=null}
if(r.v===e1&&r2===e2)return{ok:1};
if(r.x.ap)return{ok:0,m:"MATCH tanpa argumen ke-3 (atau bernilai 1) mencari secara PERKIRAAN dan butuh data terurut. Untuk mencari yang persis sama, tulis 0."};
if(r.v===e1)return{ok:0,m:"Hasilnya cocok di data ini, tetapi rumusmu belum tepat secara umum. Pastikan posisi dicari otomatis dengan MATCH dan nilai memakai referensi sel jika soal memintanya, bukan angka yang dihitung manual."};
return{ok:0,m:"Struktur rumusmu sudah baik, tetapi hasilnya belum sesuai. Periksa nomor baris/kolom (dihitung dari sel pertama rentang), cakupan rentang, dan ejaan."}}
function paint(){const f=$("f").value,h=new Set(),w=6;
(f.match(/\$?[A-F]\$?\d+(?::\$?[A-F]\$?\d+)?/gi)||[]).forEach(s=>{const g=rg(s);if(g)for(let r=g.r1;r<=g.r2;r++)for(let c=g.c1;c<=g.c2;c++)h.add(r+"."+c)});
$("tb").innerHTML="<tr><th></th>"+"ABCDEF".split("").map(x=>`<th>${x}</th>`).join("")+"</tr>"+D.map((r,i)=>`<tr><th>${i+1}</th>${Array.from({length:w},(_,j)=>`<td class="${nm(r[j])?"n ":""}${h.has((i+1)+"."+j)?"h":""}">${r[j]??""}</td>`).join("")}</tr>`).join("");
let p="";if(f.trim().length>1)try{p="Hasil sementara: <b>"+run(f.trim(),D).v+"</b>"}catch(e){p="Hasil sementara: (rumus belum lengkap)"}$("pv").innerHTML=p}
function show(){$("q").textContent=`Soal ${cur+1}: ${S[cur].t}`;$("f").value="";$("o").innerHTML="";$("rv").hidden=fails[cur]<3;
$("tabs").innerHTML=S.map((_,i)=>`<button class="${i==cur?"a":""}" data-i="${i}">${done[i]?"✓ ":""}${i+1}</button>`).join("");paint()}
$("tabs").onclick=e=>{if(e.target.dataset.i){cur=+e.target.dataset.i;show()}};
$("k").innerHTML=[";",",",'"',"(",")",":","$","0"].map(x=>`<button type="button" data-k='${x}'>${x}</button>`).join("");
$("k").onclick=e=>{const k=e.target.dataset.k;if(!k)return;const i=$("f"),s=i.selectionStart??i.value.length;i.setRangeText(k,s,i.selectionEnd??s,"end");i.focus();paint()};
